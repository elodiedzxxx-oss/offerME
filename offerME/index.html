<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>offerME - 春招offer预测</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">✅</span>
                    <span class="logo-text">offerME</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="historyBtn">
                        <span>📊</span>
                    </button>
                    <button class="icon-btn" id="profileBtn">
                        <span>👤</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Welcome Section (Step 0) -->
            <section class="welcome-section" id="welcomeSection">
                <div class="welcome-icon">✅</div>
                <h1>欢迎使用 offerME</h1>
                <p class="subtitle">AI驱动的春招offer预测<br>助你知己知彼，决胜春招</p>
                <button class="action-btn primary large" onclick="showProfileSetup()">
                    开始预测之旅
                </button>
            </section>

            <!-- Profile Setup Section (Step 1) -->
            <section class="profile-section hidden" id="profileSection">
                <div class="section-header">
                    <h2>完善候选人背景</h2>
                    <span class="step-badge">1/3</span>
                </div>
                <div class="form-card">
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" class="form-input" id="userName" placeholder="请输入你的姓名">
                    </div>
                    <div class="form-group">
                        <label>学历层次</label>
                        <select class="form-input" id="educationLevel">
                            <option value="">请选择学历</option>
                            <option value="bachelor">本科</option>
                            <option value="master">硕士</option>
                            <option value="phd">博士</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>就读年级</label>
                        <select class="form-input" id="grade">
                            <option value="">请选择年级</option>
                            <option value="sophomore">大二</option>
                            <option value="junior">大三</option>
                            <option value="senior">大四</option>
                            <option value="graduated">已毕业</option>
                            <option value="master_year1">研一</option>
                            <option value="master_year2">研二</option>
                            <option value="phd_year1">博一</option>
                            <option value="phd_year2">博二</option>
                            <option value="phd_year3+">博三及以上</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>专业类别</label>
                        <select class="form-input" id="majorCategory">
                            <option value="">请选择专业类别</option>
                            <option value="cs">计算机科学/软件工程</option>
                            <option value="ee">电子信息工程</option>
                            <option value="me">机械工程</option>
                            <option value="business">商科/管理</option>
                            <option value="finance">金融/经济</option>
                            <option value="other">其他专业</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>院校层次</label>
                        <select class="form-input" id="schoolTier">
                            <option value="">请选择院校层次</option>
                            <option value="tier1">985/211顶尖院校</option>
                            <option value="tier1_5">211重点院校</option>
                            <option value="tier2">一本院校</option>
                            <option value="tier3">二本/普通本科</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>是否有实习经历</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="hasInternship" value="yes"> 是
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="hasInternship" value="no"> 否
                            </label>
                        </div>
                    </div>
                    <div class="form-group internship-duration hidden" id="internshipGroup">
                        <label>实习段数</label>
                        <select class="form-input" id="internshipCount">
                            <option value="">请选择实习段数</option>
                            <option value="0">还没有实习</option>
                            <option value="1">1段实习</option>
                            <option value="2">2段实习</option>
                            <option value="3">3段实习</option>
                            <option value="4">4段及以上</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>已获得的专业证书数量</label>
                        <div class="slider-container">
                            <input type="range" class="slider" id="certCount" min="0" max="10" value="0">
                            <span class="slider-value" id="certCountValue">0</span>
                        </div>
                    </div>
                    <button class="action-btn primary large" onclick="saveProfile()">
                        保存并继续
                    </button>
                </div>
            </section>

            <!-- Interview Input Section (Step 2) -->
            <section class="interview-section hidden" id="interviewSection">
                <div class="section-header">
                    <h2>录入面试信息</h2>
                    <span class="step-badge">2/3</span>
                </div>
                
                <!-- Interview List -->
                <div class="interview-list" id="interviewList">
                    <!-- Interview cards will be added here -->
                </div>
                
                <!-- Add Interview Card -->
                <div class="add-interview-card" id="addInterviewCard">
                    <button class="add-interview-btn" onclick="showAddInterviewModal()">
                        <span class="add-icon">+</span>
                        <span>添加新面试</span>
                    </button>
                </div>

                <button class="action-btn primary gradient-btn" onclick="generatePrediction()">
                    ✨ 生成预测结果
                </button>
            </section>

            <!-- Prediction Results Section (Step 3) -->
            <section class="prediction-section hidden" id="predictionSection">
                <div class="section-header">
                    <h2>AI预测结果</h2>
                    <span class="step-badge">3/3</span>
                </div>
                
                <!-- Main Prediction Card -->
                <div class="prediction-main-card">
                    <div class="prediction-header">
                        <span class="ai-badge">✨ AI Powered</span>
                    </div>
                    <div class="prediction-summary">
                        <div class="offer-count-display">
                            <span class="offer-count" id="predictedOfferCount">0</span>
                            <span class="offer-unit">个offer</span>
                        </div>
                        <p class="prediction-text" id="predictionText">基于你的背景和面试表现，预测结果如下</p>
                    </div>
                </div>

                <!-- Detailed Predictions -->
                <div class="detailed-predictions" id="detailedPredictions">
                    <!-- Company predictions will be added here -->
                </div>

                <!-- Interview Analysis -->
                <div class="analysis-card">
                    <h3>📈 面试表现分析</h3>
                    <div class="analysis-content" id="analysisContent">
                        <!-- Analysis will be added here -->
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn secondary" onclick="editInterviews()">
                        编辑面试记录
                    </button>
                    <button class="action-btn primary" onclick="startNew()">
                        开始新的预测
                    </button>
                </div>
            </section>

            <!-- Dashboard View (Tab) -->
            <section class="dashboard-section hidden" id="dashboardSection">
                <div class="section-header">
                    <h2>数据概览</h2>
                </div>
                
                <!-- Stats Cards -->
                <div class="stats-section">
                    <div class="stat-card">
                        <div class="stat-icon">📋</div>
                        <div class="stat-info">
                            <span class="stat-value" id="totalInterviews">0</span>
                            <span class="stat-label">面试总数</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🏢</div>
                        <div class="stat-info">
                            <span class="stat-value" id="totalCompanies">0</span>
                            <span class="stat-label">投递公司</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🎯</div>
                        <div class="stat-info">
                            <span class="stat-value" id="avgScore">0</span>
                            <span class="stat-label">平均得分</span>
                        </div>
                    </div>
                </div>

                <!-- Interview History -->
                <div class="history-section">
                    <h3>面试记录</h3>
                    <div class="history-list" id="historyList">
                        <!-- History items will be added here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="predict" onclick="switchTab('predict')">
                <span class="nav-icon">🔮</span>
                <span class="nav-label">预测</span>
            </button>
            <button class="nav-item" data-tab="dashboard" onclick="switchTab('dashboard')">
                <span class="nav-icon">📊</span>
                <span class="nav-label">数据</span>
            </button>
            <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">我的</span>
            </button>
        </nav>

        <!-- Add Interview Modal -->
        <div class="modal" id="interviewModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>添加面试记录</h2>
                    <button class="close-btn" onclick="closeInterviewModal()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>公司名称</label>
                        <input type="text" class="form-input" id="companyName" placeholder="例如：字节跳动">
                    </div>
                    <div class="form-group">
                        <label>岗位名称</label>
                        <input type="text" class="form-input" id="positionName" placeholder="例如：后端开发工程师">
                    </div>
                    <div class="form-group">
                        <label>面试类型</label>
                        <select class="form-input" id="interviewType">
                            <option value="phone">电话面试</option>
                            <option value="video">视频面试</option>
                            <option value="onsite">现场面试</option>
                            <option value="technical">技术面试</option>
                            <option value="hr">HR面</option>
                            <option value="final">终面</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>面试轮次</label>
                        <div class="round-selector">
                            <button class="round-btn" data-round="1">1</button>
                            <button class="round-btn" data-round="2">2</button>
                            <button class="round-btn active" data-round="3">3</button>
                            <button class="round-btn" data-round="4">4</button>
                            <button class="round-btn" data-round="5">5+</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>面试时长（分钟）</label>
                        <input type="number" class="form-input" id="duration" placeholder="60" min="15" max="180">
                    </div>
                    <div class="form-group">
                        <label>问题数量</label>
                        <div class="slider-container">
                            <input type="range" class="slider" id="questionCount" min="3" max="20" value="8">
                            <span class="slider-value" id="questionCountValue">8</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>回答连贯性</label>
                        <div class="rating-group">
                            <button class="rating-btn" data-value="1">😰</button>
                            <button class="rating-btn" data-value="2">😟</button>
                            <button class="rating-btn" data-value="3">😐</button>
                            <button class="rating-btn" data-value="4" selected>🙂</button>
                            <button class="rating-btn" data-value="5">😊</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>技术表现</label>
                        <div class="rating-group">
                            <button class="rating-btn" data-value="1">😰</button>
                            <button class="rating-btn" data-value="2">😟</button>
                            <button class="rating-btn" data-value="3">😐</button>
                            <button class="rating-btn" data-value="4">🙂</button>
                            <button class="rating-btn" data-value="5">😊</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>面试官态度</label>
                        <div class="rating-group">
                            <button class="rating-btn" data-value="1">😠</button>
                            <button class="rating-btn" data-value="2">😐</button>
                            <button class="rating-btn" data-value="3">🙂</button>
                            <button class="rating-btn" data-value="4">😊</button>
                            <button class="rating-btn" data-value="5">🤩</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>整体难度</label>
                        <div class="rating-group">
                            <button class="rating-btn" data-value="1">⭐</button>
                            <button class="rating-btn" data-value="2">⭐⭐</button>
                            <button class="rating-btn" data-value="3">⭐⭐⭐</button>
                            <button class="rating-btn" data-value="4">⭐⭐⭐⭐</button>
                            <button class="rating-btn" data-value="5">⭐⭐⭐⭐⭐</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>是否有笔试/测评</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="hasTest" value="yes"> 是
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="hasTest" value="no" checked> 否
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>备注（可选）</label>
                        <textarea class="form-input textarea" id="interviewNotes" placeholder="可以记录一些面试中的特殊情况..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="action-btn secondary" onclick="closeInterviewModal()">取消</button>
                    <button class="action-btn primary" onclick="saveInterview()">保存记录</button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
